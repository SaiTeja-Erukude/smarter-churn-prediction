[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smarter-churn-prediction"
version = "0.1.0"
description = "Five-model churn prediction experiments with frozen MiniLM features"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{name = "Sai Teja Erukude"}]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.16"]

[project.scripts]
churn-prediction = "churn_prediction.cli:main"

[project.urls]
Repository = "https://github.com/SaiTeja-Erukude/smarter-churn-prediction"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
